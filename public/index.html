<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookIt</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <main class="page-shell">
        <nav class="site-nav">
            <a class="brand" href="/">BookIt</a>
            <div class="nav-links">
                <a class="active" href="/">Dashboard</a>
                <a href="/resources.html">Resources</a>
                <a class="nav-create" href="/booking.html">+ Create Booking</a>
            </div>
        </nav>
        <header class="page-header compact-header">
            <div>
                <p class="eyebrow">Your booking overview</p>
                <h1>BookIt</h1>
                <p class="subtitle">See what is booked today and manage confirmed bookings.</p>
            </div>
            <label class="day-picker">View date <input id="view-date" type="date"></label>
        </header>

        <section class="dashboard-layout">
            <section class="panel schedule-panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">Daily schedule</p>
                        <h2 id="schedule-title">Bookings</h2>
                    </div>
                    <span id="booking-count" class="count">0</span>
                </div>
                <div id="bookings" class="bookings"></div>
            </section>
            <aside class="dashboard-actions">
                <div class="action-block">
                    <p class="eyebrow">Need a resource?</p>
                    <h2>Start a new booking</h2>
                    <a class="button-link" href="/resources.html">Browse resources</a>
                </div>
                <div class="action-block mint-block">
                    <p class="eyebrow">Quick link</p>
                    <h2>Know what you need?</h2>
                    <a class="text-link" href="/booking.html">Create booking directly</a>
                </div>
            </aside>
        </section>
    </main>
    <script src="/app.js" type="module"></script>
</body>

</html>
